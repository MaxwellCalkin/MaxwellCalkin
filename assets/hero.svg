<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Maxwell Calkin — Passionate Alignment Solution Finder">
  <title>Maxwell Calkin — Passionate Alignment Solution Finder</title>

  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0d1326"/>
      <stop offset="55%"  stop-color="#070a16"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="25%"  stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style><![CDATA[
      .name  { font-family: Georgia, 'Cormorant Garamond', 'Times New Roman', serif;
               font-size: 60px; font-weight: 300; letter-spacing: 0.14em;
               fill: #f5f1e6; }
      .tag   { font-family: 'SF Mono', ui-monospace, Menlo, monospace;
               font-size: 13px; letter-spacing: 0.42em; fill: url(#textGold);
               font-weight: 600; }
      .role  { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
               font-size: 15px; letter-spacing: 0.22em; fill: #94a3b8;
               font-weight: 300; }
      .aim   { font-family: Georgia, serif; font-size: 17px;
               fill: #cbd5e1; font-style: italic; letter-spacing: 0.04em; }

      @keyframes spinSlow    { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
      @keyframes spinSlowRev { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }
      @keyframes corePulse   { 0%,100% { transform: scale(1);   opacity: 0.85; }
                               50%     { transform: scale(1.18);opacity: 1; } }
      @keyframes converge    { 0%   { stroke-dashoffset: 70; opacity: 0; }
                               25%  { opacity: 1; }
                               80%  { stroke-dashoffset: 0;  opacity: 1; }
                              100%  { stroke-dashoffset: 0;  opacity: 0; } }
      @keyframes twinkle     { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      @keyframes drift       { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

      .ring-outer { transform-origin: 230px 180px; animation: spinSlow    80s linear infinite; }
      .ring-mid   { transform-origin: 230px 180px; animation: spinSlowRev 110s linear infinite; }
      .ring-inner { transform-origin: 230px 180px; animation: spinSlow    50s linear infinite; }
      .core       { transform-origin: 230px 180px; animation: corePulse   5s ease-in-out infinite; }
      .star       { animation: twinkle 4s ease-in-out infinite; }
      .vec        { stroke-dasharray: 70; animation: converge 4s ease-in-out infinite; }
      .tagPulse   { animation: drift 7s ease-in-out infinite; }
    ]]></style>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- subtle starfield -->
  <g fill="#e2e8f0">
    <circle cx="60"   cy="50"  r="0.9" class="star" style="animation-delay: 0s"/>
    <circle cx="135"  cy="22"  r="0.6" class="star" style="animation-delay: 1.4s"/>
    <circle cx="295"  cy="35"  r="0.7" class="star" style="animation-delay: 2.1s"/>
    <circle cx="420"  cy="18"  r="0.6" class="star" style="animation-delay: 0.7s"/>
    <circle cx="610"  cy="42"  r="0.8" class="star" style="animation-delay: 3.0s"/>
    <circle cx="780"  cy="24"  r="0.6" class="star" style="animation-delay: 1.9s"/>
    <circle cx="940"  cy="50"  r="0.7" class="star" style="animation-delay: 2.6s"/>
    <circle cx="1080" cy="30"  r="0.8" class="star" style="animation-delay: 0.4s"/>
    <circle cx="1140" cy="80"  r="0.6" class="star" style="animation-delay: 1.2s"/>
    <circle cx="40"   cy="280" r="0.7" class="star" style="animation-delay: 3.6s"/>
    <circle cx="150"  cy="320" r="0.6" class="star" style="animation-delay: 2.3s"/>
    <circle cx="480"  cy="335" r="0.8" class="star" style="animation-delay: 1.6s"/>
    <circle cx="690"  cy="320" r="0.6" class="star" style="animation-delay: 0.9s"/>
    <circle cx="860"  cy="340" r="0.7" class="star" style="animation-delay: 2.8s"/>
    <circle cx="1050" cy="300" r="0.6" class="star" style="animation-delay: 0.2s"/>
    <circle cx="1170" cy="240" r="0.7" class="star" style="animation-delay: 1.7s"/>
    <circle cx="20"   cy="170" r="0.6" class="star" style="animation-delay: 2.0s"/>
  </g>

  <!-- ===== ALIGNMENT COMPASS ===== -->
  <g>
    <!-- outer ring with 12 tick marks (slow spin) -->
    <g class="ring-outer" stroke="#1e293b" fill="none">
      <circle cx="230" cy="180" r="120" stroke-width="1"/>
      <circle cx="230" cy="180" r="115" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.6"/>
      <g stroke="#475569" stroke-width="1.4">
        <line x1="230" y1="55"  x2="230" y2="68"/>
        <line x1="230" y1="305" x2="230" y2="292"/>
        <line x1="105" y1="180" x2="118" y2="180"/>
        <line x1="355" y1="180" x2="342" y2="180"/>
        <line x1="141" y1="91"  x2="150" y2="100"/>
        <line x1="319" y1="91"  x2="310" y2="100"/>
        <line x1="141" y1="269" x2="150" y2="260"/>
        <line x1="319" y1="269" x2="310" y2="260"/>
      </g>
    </g>

    <!-- middle ring (counter-rotation) -->
    <g class="ring-mid" stroke="#1e293b" fill="none">
      <circle cx="230" cy="180" r="86" stroke-width="1"/>
      <circle cx="230" cy="180" r="86" stroke-width="0.5"
              stroke-dasharray="1 8" stroke="#fbbf24" opacity="0.35"/>
    </g>

    <!-- inner ring -->
    <g class="ring-inner" stroke="#22d3ee" fill="none" opacity="0.45">
      <circle cx="230" cy="180" r="54" stroke-width="0.8" stroke-dasharray="3 4"/>
    </g>

    <!-- 8 converging vectors (cyan, pulse inward) -->
    <g stroke="#67e8f9" stroke-width="1.4" fill="none" opacity="0.75" filter="url(#softGlow)">
      <line x1="230" y1="78"  x2="230" y2="148" class="vec" style="animation-delay: 0.0s"/>
      <line x1="230" y1="282" x2="230" y2="212" class="vec" style="animation-delay: 0.5s"/>
      <line x1="128" y1="180" x2="198" y2="180" class="vec" style="animation-delay: 1.0s"/>
      <line x1="332" y1="180" x2="262" y2="180" class="vec" style="animation-delay: 1.5s"/>
      <line x1="158" y1="108" x2="208" y2="158" class="vec" style="animation-delay: 2.0s"/>
      <line x1="302" y1="108" x2="252" y2="158" class="vec" style="animation-delay: 2.5s"/>
      <line x1="158" y1="252" x2="208" y2="202" class="vec" style="animation-delay: 3.0s"/>
      <line x1="302" y1="252" x2="252" y2="202" class="vec" style="animation-delay: 3.5s"/>
    </g>

    <!-- central glow + highest aim -->
    <circle cx="230" cy="180" r="50" fill="url(#coreGlow)" class="core"/>
    <circle cx="230" cy="180" r="5"  fill="#fbbf24" filter="url(#bigGlow)"/>
    <circle cx="230" cy="180" r="2"  fill="#fff8e1"/>
  </g>

  <!-- ===== TEXT BLOCK ===== -->
  <g transform="translate(430 0)">
    <text class="tag tagPulse" x="0" y="110">PASSIONATE  ·  ALIGNMENT  ·  SOLUTION  ·  FINDER</text>
    <text class="name"          x="0" y="178">MAXWELL CALKIN</text>
    <line x1="0" y1="198" x2="380" y2="198" stroke="#fbbf24" stroke-width="1" opacity="0.55"/>
    <text class="role"          x="0" y="226">BUILDER  ·  HUSBAND  ·  FATHER  ·  STEWARD OF INTELLIGENCE</text>
    <text class="aim"           x="0" y="266">&#8220;aiming intelligence toward the highest good.&#8221;</text>
  </g>
</svg>
